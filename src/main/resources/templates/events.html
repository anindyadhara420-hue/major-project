<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Events - Techno Main</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .event-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav th:replace="~{fragments/navbar :: navbar}"></nav>

  <header class="page-header">
    <h1>College Events</h1>
    <p>Discover what's happening on campus</p>
  </header>

  <section class="section bg-light">
    <div th:if="${#lists.isEmpty(events)}" style="text-align: center; color: var(--text-light); padding: 3rem;">
        <i class="fas fa-calendar-times" style="font-size: 3rem; margin-bottom: 1rem;"></i>
        <h3>No events scheduled right now.</h3>
    </div>

    <div class="course-grid">
      <div th:each="event : ${events}" class="course-card">
        <img th:if="${event.imageUrl}" th:src="@{${event.imageUrl}}" class="event-image">
        <div class="course-body">
          <h3 style="color: var(--primary-dark); margin-bottom: 10px;" th:text="${event.title}">Title</h3>
          <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 10px;">
            <i class="fas fa-calendar-day"></i> <span th:text="${event.eventDate}">Date</span>
          </p>
          <p th:text="${event.description}">Description</p>
        </div>
      </div>
    </div>
  </section>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
