<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Techno Main</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }
    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    .gallery-caption {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s;
    }
    .gallery-item:hover .gallery-caption {
      transform: translateY(0);
    }
    /* Lightbox */
    #lightbox { display: none; position: fixed; z-index: 10000; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.9); }
    #lightbox img { max-width: 90%; max-height: 90%; margin: auto; display: block; position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
    #lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; cursor: pointer; }
  </style>
</head>
<body>
  <nav th:replace="~{fragments/navbar :: navbar}"></nav>

  <header class="page-header">
    <h1>Photo Gallery</h1>
    <p>Moments to remember</p>
  </header>

  <section class="section bg-light">
    <div th:if="${#lists.isEmpty(images)}" style="text-align: center; color: var(--text-light); padding: 3rem;">
        <i class="fas fa-images" style="font-size: 3rem; margin-bottom: 1rem;"></i>
        <h3>No images available.</h3>
    </div>

    <div class="gallery-grid">
      <div th:each="image : ${images}" class="gallery-item" th:onclick="'openLightbox(\'' + @{${image.imageUrl}} + '\')'">
        <img th:src="@{${image.imageUrl}}" alt="Gallery Image">
        <div class="gallery-caption" th:text="${image.categoryOrEvent}">Category</div>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
      <span id="lightbox-close">&times;</span>
      <img id="lightbox-img" src="">
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <script>
      function openLightbox(src) {
          document.getElementById('lightbox-img').src = src;
          document.getElementById('lightbox').style.display = 'block';
          document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
          document.getElementById('lightbox').style.display = 'none';
          document.body.style.overflow = 'auto';
      }
  </script>
</body>
</html>
