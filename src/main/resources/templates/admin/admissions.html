<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body>

    <div class="d-flex toggled" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h1 class="h3 fw-bold text-dark">Admissions Applications</h1>
                        <p class="text-muted mb-0">View applications submitted for admission</p>
                    </div>
                </div>

                <div class="content-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-custom table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">Date</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Course</th>
                                        <th>Previous Qualification</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="admission : ${admissions}">
                                        <td class="ps-4" th:text="${admission.submissionDate}">2026-01-01 12:00</td>
                                        <td class="fw-bold text-dark" th:text="${admission.fullName}">John Doe</td>
                                        <td th:text="${admission.email}">john@example.com</td>
                                        <td th:text="${admission.phone}">1234567890</td>
                                        <td th:text="${admission.course}">B.Tech</td>
                                        <td th:text="${admission.previousQualification}">10+2</td>
                                    </tr>
                                </tbody>
                            </table>
                            <div th:if="${#lists.isEmpty(admissions)}" class="text-center p-5">
                                <div class="mb-3">
                                    <i class="fas fa-file-alt fa-3x text-muted opacity-50"></i>
                                </div>
                                <h5 class="text-muted">No admission applications found</h5>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>

</html>
