<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body>

    <div class="d-flex toggled" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h1 class="h3 fw-bold text-dark">Courses</h1>
                        <p class="text-muted mb-0">Manage all available courses</p>
                    </div>
                    <a th:href="@{/admin/courses/new}" class="btn btn-primary-custom">
                        <i class="fas fa-plus me-2"></i> Add New Course
                    </a>
                </div>

                <div class="content-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-custom table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">ID</th>
                                        <th>Name</th>
                                        <th>Description</th>
                                        <th>Degree</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="course : ${courses}">
                                        <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${course.id}">#1</td>
                                        <td class="fw-bold text-dark" th:text="${course.name}">Intro to Java</td>
                                        <td class="text-muted small"
                                            th:text="${#strings.abbreviate(course.description, 50)}">Basic Java
                                            concepts...</td>
                                        <td>
                                            <span class="badge bg-primary bg-opacity-10 text-primary badge-custom"
                                                th:text="${course.degree != null ? course.degree.name : 'Unassigned'}">CS</span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}"
                                                class="btn btn-sm btn-outline-primary rounded-circle me-1" title="Edit">
                                                <i class="fas fa-pen"></i>
                                            </a>
                                            <a th:href="@{/admin/courses/delete/{id}(id=${course.id})}"
                                                class="btn btn-sm btn-outline-danger rounded-circle"
                                                onclick="return confirm('Are you sure?')" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div th:if="${#lists.isEmpty(courses)}" class="text-center p-5">
                                <div class="mb-3">
                                    <i class="fas fa-books fa-3x text-muted opacity-50"></i>
                                </div>
                                <h5 class="text-muted">No courses found</h5>
                                <p class="text-muted small">Add courses to populate the list.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>

</html>
