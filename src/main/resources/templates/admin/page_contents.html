<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body>

    <div class="d-flex toggled" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h1 class="h3 fw-bold text-dark">Dynamic Pages</h1>
                        <p class="text-muted mb-0">Manage content for Explore, Academic, and Facilities</p>
                    </div>
                    <a th:href="@{/admin/pages/new}" class="btn btn-primary-custom">
                        <i class="fas fa-plus me-2"></i> Add New Page
                    </a>
                </div>

                <div class="content-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-custom table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">Category</th>
                                        <th>Title</th>
                                        <th>Slug</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${pages}">
                                        <td class="ps-4">
                                            <span class="badge bg-primary bg-opacity-10 text-primary badge-custom"
                                                th:text="${p.category}">EXPLORE</span>
                                        </td>
                                        <td class="fw-bold text-dark" th:text="${p.title}">Mission & Vision</td>
                                        <td class="text-muted small" th:text="${p.slug}">mission-vision</td>
                                        <td class="text-end pe-4">
                                            <a th:href="@{/admin/pages/edit/{id}(id=${p.id})}"
                                                class="btn btn-sm btn-outline-primary rounded-circle me-1" title="Edit">
                                                <i class="fas fa-pen"></i>
                                            </a>
                                            <a th:href="@{/admin/pages/delete/{id}(id=${p.id})}"
                                                class="btn btn-sm btn-outline-danger rounded-circle"
                                                onclick="return confirm('Are you sure?')" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div th:if="${#lists.isEmpty(pages)}" class="text-center p-5">
                                <div class="mb-3">
                                    <i class="fas fa-file-alt fa-3x text-muted opacity-50"></i>
                                </div>
                                <h5 class="text-muted">No dynamic pages found</h5>
                                <p class="text-muted small">Create pages to enable dynamic content on the website.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>

</html>
