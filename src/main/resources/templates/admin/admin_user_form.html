<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body>
    <div class="d-flex toggled" id="wrapper">
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
        <div id="page-content-wrapper">
            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>
            <div class="container-fluid px-4 py-4">
                <h1 class="h3 mb-4 fw-bold text-dark" th:text="${adminUser.id == null ? 'Add Admin User' : 'Edit Admin User'}"></h1>
                <div class="content-card">
                    <div class="card-body">
                        <form th:action="@{/admin/users}" th:object="${adminUser}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold">Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" 
                                       th:required="${adminUser.id == null}">
                                <div class="form-text" th:if="${adminUser.id != null}">
                                    Leave blank to keep the current password.
                                </div>
                            </div>

                            <div class="mb-4 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="enabled" th:field="*{enabled}">
                                <label class="form-check-label fw-bold" for="enabled">Account Enabled</label>
                            </div>
                            
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary-custom me-2">
                                    <i class="fas fa-save me-1"></i> Save Admin
                                </button>
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>
</html>
