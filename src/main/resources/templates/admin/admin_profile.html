<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head}"></head>
<body>
    <div class="d-flex toggled" id="wrapper">
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
        <div id="page-content-wrapper">
            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>
            <div class="container-fluid px-4 py-4">
                <h1 class="h3 mb-4 fw-bold text-dark">Admin Profile</h1>
                
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="content-card">
                            <div class="card-body">
                                <h5>Profile Information</h5>
                                <div class="mb-3 mt-3">
                                    <label class="form-label fw-bold">Username</label>
                                    <input type="text" class="form-control" th:value="${adminUser.username}" readonly disabled>
                                    <div class="form-text">Username cannot be changed.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="content-card">
                            <div class="card-body">
                                <h5>Change Password</h5>
                                <form th:action="@{/admin/profile/change-password}" method="post" class="mt-3">
                                    <div class="mb-3">
                                        <label for="newPassword" class="form-label fw-bold">New Password</label>
                                        <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="4">
                                    </div>
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label fw-bold">Confirm New Password</label>
                                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="4">
                                    </div>
                                    <button type="submit" class="btn btn-primary-custom">
                                        <i class="fas fa-key me-1"></i> Update Password
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>
</html>
