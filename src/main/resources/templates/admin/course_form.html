<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body>

    <div class="d-flex toggled" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">

                <h1 class="h3 mb-4 fw-bold text-dark"
                    th:text="${course.id == null ? 'Create New Course' : 'Edit Course'}">Create Course</h1>

                <div class="content-card">
                    <div class="card-body">
                        <form th:action="@{/admin/courses}" th:object="${course}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Course Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required
                                    placeholder="e.g. Data Structures">
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                    placeholder="Brief description of the course"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="degree" class="form-label fw-bold">Degree</label>
                                <select class="form-select" id="degree" th:field="*{degree}">
                                    <option value="">Select Degree</option>
                                    <option th:each="d : ${degrees}" th:value="${d.id}" th:text="${d.name}"></option>
                                </select>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary-custom me-2">
                                    <i class="fas fa-save me-1"></i> Save Course
                                </button>
                                <a th:href="@{/admin/courses}"
                                    class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>

</html>
