<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body>

    <div class="d-flex toggled" id="wrapper">
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 fw-bold text-dark mb-0">Hero Sliders</h1>
                        <p class="text-muted mb-0">Manage images displayed in the home page carousel</p>
                    </div>
                    <a th:href="@{/admin/hero-sliders/new}" class="btn btn-primary shadow-sm rounded-pill px-4">
                        <i class="fas fa-plus me-2"></i>Add New Slider
                    </a>
                </div>

                <div class="content-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Image</th>
                                        <th>Title</th>
                                        <th>Order</th>
                                        <th>Status</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="slider : ${sliders}">
                                        <td class="ps-4">
                                            <img th:if="${slider.imageUrl}" th:src="@{${slider.imageUrl}}" alt="Slider" style="height: 60px; width: 100px; object-fit: cover; border-radius: 4px;">
                                            <span th:unless="${slider.imageUrl}" class="text-muted small">No Image</span>
                                        </td>
                                        <td>
                                            <span th:text="${slider.title}">Title</span><br>
                                            <small class="text-muted" th:text="${slider.subtitle}">Subtitle</small>
                                        </td>
                                        <td th:text="${slider.displayOrder}">0</td>
                                        <td>
                                            <span th:if="${slider.isActive}" class="badge bg-success">Active</span>
                                            <span th:unless="${slider.isActive}" class="badge bg-secondary">Inactive</span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <a th:href="@{/admin/hero-sliders/edit/{id}(id=${slider.id})}" class="btn btn-sm btn-outline-primary rounded-circle me-2" title="Edit">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a th:href="@{/admin/hero-sliders/delete/{id}(id=${slider.id})}" class="btn btn-sm btn-outline-danger rounded-circle" onclick="return confirm('Are you sure you want to delete this slider?');" title="Delete">
                                                <i class="fas fa-trash-alt"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(sliders)}">
                                        <td colspan="5" class="text-center py-4 text-muted">No hero sliders found. Add one to display on the home page.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>
</html>
