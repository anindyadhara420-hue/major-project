<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Techno Main Saltlake</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-header {
            background: #990014;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px 10px 0 0;
        }
        .login-body {
            padding: 30px;
            background: white;
            border-radius: 0 0 10px 10px;
        }
        .btn-primary-custom {
            background-color: #D7001C;
            border-color: #D7001C;
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: #990014;
            border-color: #990014;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <h4><i class="fas fa-lock me-2"></i>Admin Login</h4>
            <p class="mb-0 small">Techno Main Saltlake CMS</p>
        </div>
        <div class="login-body">
            <div th:if="${param.error}" class="alert alert-danger py-2">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2">
                You have been logged out.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary-custom btn-lg">Login</button>
                </div>
                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Back to Public Site</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
