<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body>

    <div class="d-flex toggled" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <nav th:replace="~{admin/fragments/topbar :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h1 class="h3 fw-bold text-dark">Events</h1>
                        <p class="text-muted mb-0">Manage college events</p>
                    </div>
                    <a th:href="@{/admin/events/new}" class="btn btn-primary-custom">
                        <i class="fas fa-plus me-2"></i> Add New Event
                    </a>
                </div>

                <div class="content-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-custom table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">ID</th>
                                        <th>Image</th>
                                        <th>Title</th>
                                        <th>Event Date</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="event : ${events}">
                                        <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${event.id}">#1</td>
                                        <td>
                                            <img th:if="${event.imageUrl}" th:src="@{${event.imageUrl}}" alt="Event Image" style="width: 50px; height: 50px; object-fit: cover;" class="rounded">
                                            <span th:unless="${event.imageUrl}" class="text-muted">No Image</span>
                                        </td>
                                        <td class="fw-bold text-dark" th:text="${event.title}">Title</td>
                                        <td th:text="${event.eventDate}">2026-01-01</td>
                                        <td class="text-end pe-4">
                                            <a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
                                                class="btn btn-sm btn-outline-primary rounded-circle me-1" title="Edit">
                                                <i class="fas fa-pen"></i>
                                            </a>
                                            <a th:href="@{/admin/events/delete/{id}(id=${event.id})}"
                                                class="btn btn-sm btn-outline-danger rounded-circle"
                                                onclick="return confirm('Are you sure?')" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div th:if="${#lists.isEmpty(events)}" class="text-center p-5">
                                <div class="mb-3">
                                    <i class="fas fa-calendar-alt fa-3x text-muted opacity-50"></i>
                                </div>
                                <h5 class="text-muted">No events found</h5>
                                <p class="text-muted small">Get started by creating a new event.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</body>

</html>
